name: Validate Extension

on:
  push:
    branches:
      - agent/growth-focused-v1-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify extension and release package
        run: npm run verify

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: chorus-chrome-v1.1.0
          path: .output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true
