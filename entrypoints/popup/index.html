<!DOCTYPE html>
<html lang="en" style="overscroll-behavior: none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chorus</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="/icons/icon48.png" alt="" class="brand-mark" />
          <div>
            <h1>Chorus</h1>
            <p id="tagline"></p>
          </div>
        </div>
        <button
          id="languageButton"
          class="icon-button"
          type="button"
          aria-label="Switch language"
        ></button>
      </header>

      <section class="prompt-card" aria-labelledby="promptLabel">
        <div class="section-row">
          <label id="promptLabel" for="promptInput"></label>
          <button id="clearButton" class="text-button" type="button"></button>
        </div>
        <textarea id="promptInput" rows="5" maxlength="12000" autofocus></textarea>
      </section>

      <section class="models-section" aria-labelledby="modelsLabel">
        <div class="section-row section-row-top">
          <div>
            <h2 id="modelsLabel"></h2>
            <p id="modelsHint" class="section-hint"></p>
          </div>
          <button id="refreshReadinessButton" class="text-button" type="button"></button>
        </div>
        <div id="modelsGrid" class="models-grid"></div>
      </section>

      <div id="progressPanel" class="progress-panel" hidden>
        <div class="progress-copy">
          <span id="progressText"></span>
          <button id="cancelButton" class="text-button" type="button"></button>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <section id="resultsPanel" class="results-panel" hidden>
        <div class="results-heading">
          <h2 id="resultsTitle"></h2>
          <button id="retryButton" class="text-button" type="button" hidden></button>
        </div>
        <div id="resultsList" class="results-list"></div>
      </section>

      <p id="inlineMessage" class="inline-message" role="status" hidden></p>

      <button id="askButton" class="primary-button" type="button" disabled></button>
      <p id="privacyNote" class="privacy-note"></p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
